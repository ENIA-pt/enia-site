name: Sync + Deploy Hostinger

# Substitui o pipeline Netlify.
# 1) corre a recolha diária de fontes oficiais
# 2) regenera bundle.js e o build /en/
# 3) publica por FTPS em public_html
#
# Segredos a criar em GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER    ex.: ftp.enia.pt          (hPanel → Ficheiros → Contas FTP)
#   FTP_USERNAME  ex.: u123456789.enia
#   FTP_PASSWORD  (password da conta FTP, nunca a da conta Hostinger)

on:
  schedule:
    - cron: '0 23 * * *'      # 00:00 CET / 01:00 CEST — UTC-1
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci || npm install

      # --- recolha de dados (só no cron e no disparo manual) ------------
      - name: Sincronizar fontes oficiais
        if: github.event_name != 'push'
        run: node scripts/sync.mjs
        continue-on-error: true      # uma fonte em baixo não pode parar o deploy

      - name: Regenerar bundle.js
        run: node scripts/bundle.mjs

      - name: Regenerar build EN
        run: '[ -f scripts/i18n.mjs ] && node scripts/i18n.mjs || echo "sem i18n.mjs"'

      # --- guardar os dados novos no repositório ------------------------
      - name: Commit dos dados
        if: github.event_name != 'push'
        run: |
          git config user.name  "ENIA Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ en/ || true
          git diff --staged --quiet || git commit -m "radar: dados de $(date -u +%Y-%m-%d)"
          git push || true

      # --- publicação --------------------------------------------------
      - name: Deploy FTPS para public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            scripts/**
            api/refresh-data.js
            netlify.toml
            vercel.json
            package.json
            package-lock.json
            README.md
            **/*.mjs
